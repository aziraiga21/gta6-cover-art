<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ed">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <title>Sunset Cover Studio</title>
</head>
<body>
  <header class="masthead">
    <div class="identity">
      <span class="sunmark" aria-hidden="true"></span>
      <h1>Sunset <span>Cover Studio</span></h1>
    </div>
    <button class="download" type="button" data-download>Export PNG <span aria-hidden="true">↓</span></button>
  </header>
  <main class="workspace">
    <section class="stage" aria-label="Cover preview">
      <div class="stage-bar">
        <h2>Cover preview</h2>
        <output data-resolution></output>
      </div>
      <div class="mat">
        <canvas data-artwork role="img" aria-label="Your multi-panel poster"></canvas>
      </div>
      <p class="stage-note">Click a panel to select it. Drag to pan or scroll to zoom.</p>
    </section>
    <aside class="inspector" aria-label="Cover settings">
      <fieldset>
        <legend>Composition</legend>
        <div class="pair">
          <label>Layout
            <select name="arrangement">
              <option value="hero2">Hero + 2</option>
              <option value="hero3">Hero + 3</option>
              <option value="grid">2 × 2 grid</option>
            </select>
          </label>
          <label>Size
            <select name="format">
              <option value="1920x1080">1920 × 1080</option>
              <option value="1080x1350">1080 × 1350</option>
              <option value="1080x1080">1080 × 1080</option>
            </select>
          </label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Panel photo</legend>
        <div class="panel-buttons" data-panels role="group" aria-label="Select a panel"></div>
        <div class="photo-buttons">
          <button type="button" data-sample="pier">Pier</button>
          <button type="button" data-sample="boulevard">Boulevard</button>
          <label class="upload">Upload photo<input type="file" name="upload" accept="image/*"></label>
        </div>
        <div class="crop">
          <label>Zoom<input name="magnification" type="range" min="1" max="3" step="0.01"></label>
          <label>Pan X<input name="horizontal" type="range" min="-1" max="1" step="0.01"></label>
          <label>Pan Y<input name="vertical" type="range" min="-1" max="1" step="0.01"></label>
        </div>
        <button class="text-button" type="button" data-repeat>Use this photo in all panels</button>
      </fieldset>
      <fieldset>
        <legend>Lettering</legend>
        <label>Main caption<input name="headline" type="text" maxlength="80"></label>
        <label>Subcaption<input name="tagline" type="text" maxlength="120"></label>
        <div class="pair">
          <label>Position
            <select name="placement">
              <option value="bottom">Bottom</option>
              <option value="top">Top</option>
            </select>
          </label>
          <label>Caption size<input name="letterScale" type="range" min="0.6" max="1.5" step="0.05"></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Color grade</legend>
        <div class="pair">
          <label>Grade
            <select name="palette">
              <option value="sunset">Sunset</option>
              <option value="neon">Neon</option>
              <option value="noir">Noir</option>
              <option value="vice">Vice</option>
            </select>
          </label>
          <label>Intensity <output data-strength></output><input name="strength" type="range" min="0" max="1" step="0.01"></label>
        </div>
        <label class="toggle"><input name="flatTones" type="checkbox"> Posterize</label>
      </fieldset>
      <p class="feedback" role="status" data-feedback></p>
    </aside>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
